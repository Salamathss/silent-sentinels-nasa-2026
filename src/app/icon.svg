  <circle cx="16" cy="16" r="15" fill="#08080A" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
  
  <!-- Subtle Cardinal Telemetry Crosshairs -->
  <line x1="16" y1="2" x2="16" y2="5" stroke="#D6C7B2" stroke-width="1" opacity="0.6" />
  <line x1="16" y1="27" x2="16" y2="30" stroke="#D6C7B2" stroke-width="1" opacity="0.6" />
  <line x1="2" y1="16" x2="5" y2="16" stroke="#D6C7B2" stroke-width="1" opacity="0.6" />
  <line x1="27" y1="16" x2="30" y2="16" stroke="#D6C7B2" stroke-width="1" opacity="0.6" />

  <!-- Thin Champagne-Gold Orbital Ring -->
